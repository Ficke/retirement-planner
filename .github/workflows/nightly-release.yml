name: Nightly Production Release

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: production-release-tag
  cancel-in-progress: false

jobs:
  release:
    name: Release Current Main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create release tag
        id: release
        env:
          RELEASE_TIME_ZONE: America/Los_Angeles
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          latest_release_tag="$(
            git for-each-ref \
              --count=1 \
              --sort=-creatordate \
              --format='%(refname:short)' \
              'refs/tags/deploy-*'
          )"

          if [[ -n "$latest_release_tag" ]]; then
            latest_release_commit="$(git rev-list -n 1 "$latest_release_tag")"
            if [[ "$latest_release_commit" == "$GITHUB_SHA" ]]; then
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "Main is already released as $latest_release_tag." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if ! git merge-base --is-ancestor "$latest_release_commit" "$GITHUB_SHA"; then
              echo "::error::Latest release $latest_release_tag is not an ancestor of main."
              exit 1
            fi

            if git diff --quiet "$latest_release_commit" "$GITHUB_SHA" -- \
              apps/web \
              rust-simulation-service \
              scripts \
              Dockerfile \
              .dockerignore \
              .gcloudignore \
              cloudbuild.yaml \
              package.json \
              pnpm-lock.yaml \
              pnpm-workspace.yaml; then
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "No production artifacts changed since $latest_release_tag." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          release_date="$(TZ="$RELEASE_TIME_ZONE" date +%Y-%m-%d)"
          release_sequence=1
          release_tag="deploy-$release_date.$release_sequence"
          while git show-ref --verify --quiet "refs/tags/$release_tag"; do
            release_sequence=$((release_sequence + 1))
            release_tag="deploy-$release_date.$release_sequence"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$release_tag" "$GITHUB_SHA" -m "Nightly production release $release_tag"
          git push origin "refs/tags/$release_tag"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Created $release_tag for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      # Pushes authenticated with GITHUB_TOKEN do not start other Actions
      # workflows, so launch the edge deployment explicitly for this tag.
      - name: Dispatch edge deployment
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run deploy-edge.yml --ref "$RELEASE_TAG"
