name: Tests

# Documentation and agent/editor config cannot change any tested behavior, so
# they skip the suite. Everything not listed here still runs the full matrix.
on:
  pull_request:
    branches: [main]
    paths-ignore: &ignored-paths
      - '**/*.md'
      - '.gitignore'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.config/**'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore: *ignored-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  edge-proxy:
    name: Edge Proxy Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Worker
        run: pnpm -C apps/edge-proxy check

  test-typescript:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: retirement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retirement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check committed Wasm provenance
        run: pnpm wasm:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test
        env:
          RUN_DATABASE_INTEGRATION: "true"
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/retirement_ci

      # Pre-merge only. On main, Cloud Build runs the real build moments later,
      # and a failure there leaves the previous revision serving.
      - name: Test build (same as Cloud Build)
        if: github.event_name == 'pull_request'
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: placeholder-for-build
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder-project
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: 1:000000000000:web:placeholder

      - name: Test summary
        if: always()
        run: |
          echo "### TypeScript Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ All tests, typecheck, lint, and build passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests, typecheck, lint, or build failed. Please fix the errors." >> $GITHUB_STEP_SUMMARY
          fi

  # End-to-end smoke tests. These run signed out (LOCAL data mode), so they
  # need no database, no Firebase project, and no secrets. The placeholder
  # config also verifies that a bad auth configuration still leaves local mode usable.
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm -C apps/web exec playwright test --project=chromium
        env:
          VITE_FIREBASE_API_KEY: placeholder-for-build
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder-project
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: 1:000000000000:web:placeholder

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  test-rust:
    name: Test Rust Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.91.0'
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: rust-simulation-service/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        working-directory: rust-simulation-service
        run: cargo check --release

      - name: Check browser target
        working-directory: rust-simulation-service
        run: cargo clippy --release --target wasm32-unknown-unknown --lib -- -D warnings

      - name: Check formatting
        working-directory: rust-simulation-service
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: rust-simulation-service
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust-simulation-service

      - name: Run cargo test
        working-directory: rust-simulation-service
        run: cargo test --release

      - name: Test summary
        if: always()
        run: |
          echo "### Rust Test Results 🦀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ All Rust checks, clippy, and tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Rust checks, clippy, or tests failed. Please fix the errors." >> $GITHUB_STEP_SUMMARY
          fi

  engine-contract:
    name: Native Rust ↔ Wasm Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.91.0'
          components: rustfmt
          target: wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated historical data
        run: node scripts/gen-rust-historical-data.mjs --check

      - name: Check generated state tax table
        run: node scripts/gen-rust-state-tax.mjs --check

      - name: Rebuild and verify committed Wasm package
        run: |
          pnpm wasm:build
          git diff --exit-code -- apps/web/src/wasm

      - name: Build Rust service
        working-directory: rust-simulation-service
        run: cargo build --release

      - name: Start Rust service
        shell: bash
        run: |
          PORT=18081 RUST_LOG=warn ./rust-simulation-service/target/release/simulation-server > "$RUNNER_TEMP/rust-service.log" 2>&1 &
          echo "RUST_SERVICE_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/rust-service.log"
          exit 1

      - name: Run native and Wasm contract tests
        run: pnpm -C apps/web test:contract
        env:
          RUST_SERVICE_URL: http://127.0.0.1:18081

      - name: Upload Rust service log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-contract-service-log
          path: ${{ runner.temp }}/rust-service.log
          retention-days: 7

      - name: Stop Rust service
        if: always()
        shell: bash
        run: |
          if [ -n "${RUST_SERVICE_PID:-}" ]; then
            kill "$RUST_SERVICE_PID" 2>/dev/null || true
          fi

  infrastructure:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.3'

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without the production backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Initialize Cloudflare Terraform without the production backend
        run: terraform -chdir=terraform/cloudflare init -backend=false -input=false

      - name: Validate Cloudflare Terraform
        run: terraform -chdir=terraform/cloudflare validate

  # The deploy scripts run only in the pipeline, where a failure is expensive
  # and slow to reproduce. Everything else in this workflow gets a linter.
  deploy-scripts:
    name: Deploy Script Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shellcheck
        run: shellcheck scripts/smoke-check.sh scripts/pull-secrets.sh

      - name: Test deployment helpers
        run: python3 scripts/cloud_run_candidate_test.py

  # Builds both images and then runs them. Building only proves they compile;
  # every production deploy failure so far has been at runtime, in the wiring
  # between the two services. Compose reproduces that wiring.
  containers:
    name: Container Smoke Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_FIREBASE_API_KEY: placeholder-for-build
      VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: placeholder-project
      VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: 1:000000000000:web:placeholder

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build both images
        run: docker compose build

      - name: Start the stack
        run: docker compose up --detach

      # The same script the pipeline runs against a candidate revision. Its own
      # retry loop doubles as the readiness wait, so there is no second poller
      # here to drift out of sync with it.
      - name: Smoke check the running stack
        env:
          SMOKE_ATTEMPTS: 30
          ORIGIN_SECRET: local-compose-origin-secret
        run: ./scripts/smoke-check.sh http://localhost:3000

      - name: Verify production HTTP routing
        shell: bash
        run: |
          origin_header='x-retire-plan-origin-secret: local-compose-origin-secret'

          known_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "$origin_header" http://localhost:3000/auth/signin)
          test "$known_status" = 200

          unknown_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "$origin_header" http://localhost:3000/does-not-exist)
          test "$unknown_status" = 404

          missing_asset_status=$(curl --silent --output /dev/null \
            --dump-header "$RUNNER_TEMP/missing-asset-headers" --write-out '%{http_code}' \
            --header "$origin_header" http://localhost:3000/assets/missing.abc123.js)
          test "$missing_asset_status" = 404
          ! grep --ignore-case --quiet '^cache-control:.*immutable' \
            "$RUNNER_TEMP/missing-asset-headers"

          wasm_file=$(docker compose exec --no-TTY web \
            find /app/dist/assets -name '*.wasm' -print -quit | tr -d '\r')
          test -n "$wasm_file"
          wasm_status=$(curl --silent --output /dev/null \
            --dump-header "$RUNNER_TEMP/wasm-asset-headers" --write-out '%{http_code}' \
            --header "$origin_header" \
            "http://localhost:3000/assets/$(basename "$wasm_file")")
          test "$wasm_status" = 200
          grep --ignore-case --quiet '^content-type:.*application/wasm' \
            "$RUNNER_TEMP/wasm-asset-headers"
          grep --ignore-case --quiet '^cache-control:.*immutable' \
            "$RUNNER_TEMP/wasm-asset-headers"

      - name: Dump container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
