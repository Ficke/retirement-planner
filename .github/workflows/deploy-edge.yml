name: Deploy Edge Worker

on:
  push:
    tags:
      - 'deploy-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    if: vars.EDGE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the Worker deploys, never from a request. The Worker refuses to
      # serve below REQUIRED_SCHEMA_VERSION, so a skipped migration fails closed
      # rather than writing against a schema the code does not expect.
      - name: Apply database migrations
        run: pnpm -C apps/web exec tsx scripts/migrate.ts
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_GRANT_ROLE: retire_worker

      - name: Build client and Worker
        run: pnpm -C apps/web build:edge

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: '4.128.0'
          packageManager: pnpm
          command: deploy --strict

      # The SPA fallback answers a missing asset with the shell at status 200,
      # so a mismatched upload has no error signal of its own.
      - name: Verify deployed assets
        run: ./scripts/verify-edge-assets.sh https://adamficke.dev

      # The only check that covers Worker -> minted OIDC token -> private Rust
      # service. It needs a dedicated Firebase account that also has a row in
      # the application users table; set EDGE_SMOKE_ENABLED once that exists.
      - name: Smoke check the simulation path
        if: vars.EDGE_SMOKE_ENABLED == 'true'
        run: ./scripts/smoke-check-edge.sh https://adamficke.dev
        env:
          FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}

      # A Worker that cannot serve its own assets or a simulation must not stay
      # live while it is investigated. Conditioned on the deploy having
      # succeeded, so a failed build never reverts a healthy Worker.
      - name: Roll back the Worker
        if: failure() && steps.deploy.outcome == 'success'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: '4.128.0'
          packageManager: pnpm
          command: rollback --yes --message "Post-deploy verification failed for ${{ github.ref_name }}"
