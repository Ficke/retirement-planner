name: Deploy Edge Worker

on:
  push:
    tags:
      - 'deploy-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    if: vars.EDGE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the Worker deploys, never from a request. The Worker refuses to
      # serve below REQUIRED_SCHEMA_VERSION, so a skipped migration fails closed
      # rather than writing against a schema the code does not expect.
      - name: Apply database migrations
        run: pnpm -C apps/web exec tsx scripts/migrate.ts
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_GRANT_ROLE: retire_worker

      - name: Build client and Worker
        run: pnpm -C apps/web build:edge

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: '4.128.0'
          packageManager: pnpm
          command: deploy --strict

      # The SPA fallback answers a missing asset with the shell at status 200,
      # so a mismatched upload has no error signal of its own.
      #
      # Exit 2 is the script's one rollback-worthy verdict: the deployment is
      # serving this build and this build is wrong. Exit 1 is "could not
      # verify" -- unreachable host, no local build output, the new version
      # never seen rolling out -- and must not revert anything.
      - name: Verify deployed assets
        id: verify
        run: |
          set +e
          ./scripts/verify-edge-assets.sh https://adamficke.dev
          status=$?
          [ "$status" -eq 2 ] && verdict=broken || verdict=unverified
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          exit $status

      # The only check that covers Worker -> minted OIDC token -> private Rust
      # service. It needs a dedicated Firebase account that also has a row in
      # the application users table; set EDGE_SMOKE_ENABLED once that exists.
      #
      # This one alerts rather than rolls back: it fails the job, and the failed
      # run is the page. Every dependency it crosses -- Firebase, the Rust
      # service, the database -- can be down while the deploy is fine, and
      # reverting the Worker does not restore any of them. It swaps a known
      # outage for an unannounced version change on top of it. It has no verdict
      # of its own to offer, which is the same reason the asset gate's exit 1
      # does not revert either.
      - name: Smoke check the simulation path
        if: vars.EDGE_SMOKE_ENABLED == 'true'
        run: ./scripts/smoke-check-edge.sh https://adamficke.dev
        env:
          FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}

      # A Worker that cannot serve the build it just uploaded must not stay live
      # while it is investigated: every page load is already broken, and the
      # previous version is known to serve.
      #
      # Both deploys this step reverted in error -- deploy-2026-09-04.1 and .2 --
      # were healthy builds that the asset gate could not verify, so the gate's
      # exit status alone is not the signal. It answers only to the verdict that
      # the build under test is serving and wrong. Reverting on anything weaker
      # discards a good version to fix nothing.
      - name: Roll back the Worker
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outputs.verdict == 'broken'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: '4.128.0'
          packageManager: pnpm
          command: rollback --yes --message "${{ github.ref_name }} deployed and could not serve its own assets"
