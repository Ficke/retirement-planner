[package]
name = "retirement-simulation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework and async runtime
tokio = { version = "1.0", features = ["full"] }
warp = { version = "0.4", features = ["server"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parallel processing
rayon = "1.7"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Lazy static initialization
once_cell = "1.19"

# Environment variables (maintained fork of dotenv)
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "simulation-server"
path = "src/main.rs"
