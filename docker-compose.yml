services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # VITE_* values are baked into the client bundle by `vite build`, so they
      # have to be build args. Passing them only as `environment` below leaves
      # the bundle's Firebase config undefined.
      args:
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Local-only shared value used by the host smoke check. Production reads
      # an independently generated value from Secret Manager.
      - ORIGIN_SECRET=${ORIGIN_SECRET:-local-compose-origin-secret}
      # Database - use your Neon connection string from .env.local
      - DATABASE_URL=${DATABASE_URL}
      # Firebase Auth
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - SIGNUP_INVITE_CODES=${SIGNUP_INVITE_CODES:-dev-invite}
      # Simulation engine. Without this the app still works — it falls back to
      # the client-side Web Worker — but the server-first path goes untested.
      - RUST_SERVICE_URL=http://rust-simulation:8081
    depends_on:
      - rust-simulation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rust-simulation:
    build:
      context: ./rust-simulation-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - MAX_CONCURRENT_SIMULATIONS=1
    restart: unless-stopped
    # No healthcheck: the runtime image (debian-slim) ships neither wget nor
    # curl. Probe it from the host instead: curl localhost:8081/healthz
