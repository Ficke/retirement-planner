# Optimized Google Cloud Build configuration
# Key improvements:
# - Rust simulation service deployed first (IAM-authenticated)
# - Tests run in GitHub Actions on PR (not duplicated here)
# - Kaniko for ALL Docker builds with layer caching (both Rust + Vite/Hono)
# - Consistent build process, no 'images' section conflicts
# - Total time reduction: ~50% faster builds

substitutions:
  _SERVICE_NAME: retire-plan
  _RUST_SERVICE_NAME: rust-simulation-service
  _REGION: us-central1
  _REGISTRY: us-central1-docker.pkg.dev
  _REPOSITORY: retire-plan
  # Firebase client config — baked into the Vite JS bundle.
  # Not secrets (Firebase client config is intentionally public; security via Firebase Rules).
  # Actual values are set in the Cloud Build trigger via Terraform build_substitutions.
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_STORAGE_BUCKET: ''
  _FIREBASE_MESSAGING_SENDER_ID: ''
  _FIREBASE_APP_ID: ''
  _FIREBASE_MEASUREMENT_ID: ''
  _ORIGIN_SECRET_VERSION: '1'

steps:
  # ===== BUILD PHASE (parallel) =====
  # Both images build concurrently. Neither service is deployed until both succeed.
  # A broken web build can no longer leave a half-deployed Rust service behind.

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'validate-web-build-config'
    waitFor: ['-']
    entrypoint: 'sh'
    env:
      - 'FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - 'FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - 'FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - 'FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - 'FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - 'FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
    args:
      - '-c'
      - |
        set -eu
        : "$${FIREBASE_API_KEY:?Cloud Build trigger is missing _FIREBASE_API_KEY}"
        : "$${FIREBASE_AUTH_DOMAIN:?Cloud Build trigger is missing _FIREBASE_AUTH_DOMAIN}"
        : "$${FIREBASE_PROJECT_ID:?Cloud Build trigger is missing _FIREBASE_PROJECT_ID}"
        : "$${FIREBASE_STORAGE_BUCKET:?Cloud Build trigger is missing _FIREBASE_STORAGE_BUCKET}"
        : "$${FIREBASE_MESSAGING_SENDER_ID:?Cloud Build trigger is missing _FIREBASE_MESSAGING_SENDER_ID}"
        : "$${FIREBASE_APP_ID:?Cloud Build trigger is missing _FIREBASE_APP_ID}"

  - name: 'hashicorp/terraform:1.15.3'
    id: 'verify-terraform-applied'
    waitFor: ['-']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        terraform -chdir=terraform init -input=false

        set +e
        terraform -chdir=terraform plan \
          -var-file=production.tfvars \
          -detailed-exitcode \
          -input=false \
          -lock=false \
          -no-color \
          -refresh=false
        plan_status=$$?
        set -e

        if [ "$$plan_status" -eq 2 ]; then
          echo "Production infrastructure has unapplied Terraform changes. Apply and review Terraform before deploying."
          exit 1
        fi
        exit "$$plan_status"

  - name: 'hashicorp/terraform:1.15.3'
    id: 'verify-cloudflare-terraform-applied'
    waitFor: ['-']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        terraform -chdir=terraform/cloudflare init -input=false

        set +e
        terraform -chdir=terraform/cloudflare plan \
          -var-file=production.tfvars \
          -detailed-exitcode \
          -input=false \
          -lock=false \
          -no-color \
          -refresh=false
        plan_status=$$?
        set -e

        if [ "$$plan_status" -eq 2 ]; then
          echo "Production Cloudflare infrastructure has unapplied Terraform changes. Apply and review Terraform before deploying."
          exit 1
        fi
        exit "$$plan_status"

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-rust'
    waitFor: ['-']
    args:
      - '--context=dir://rust-simulation-service'
      - '--dockerfile=rust-simulation-service/Dockerfile'
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_RUST_SERVICE_NAME}:$COMMIT_SHA'
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_RUST_SERVICE_NAME}:latest'
      - '--cache=true'
      - '--cache-ttl=720h'
      - '--compressed-caching=false'
      - '--snapshot-mode=redo'
      - '--use-new-run'

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push'
    waitFor: ['validate-web-build-config']
    args:
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '--cache=true'
      - '--cache-ttl=720h'
      - '--compressed-caching=false'
      - '--snapshot-mode=redo'
      - '--use-new-run'
      - '--build-arg=VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg=VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg=VITE_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg=VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '--build-arg=VITE_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}'

  # ===== DEPLOY PHASE =====
  # Only runs if both builds above passed.
  #
  # The web service is deployed with --no-traffic behind a `candidate` tag and
  # only promoted once a real simulation has run against that tag's URL. Traffic
  # therefore moves after the check, not before it — a revision that cannot
  # serve is never reachable by users, and a failed build leaves the previous
  # revision serving.
  #
  # Rust is promoted before the web candidate is tested, because the web
  # service's SA is the only identity with run.invoker on it, so Cloud Build
  # cannot call a Rust revision directly. Deploying it --no-traffic first still
  # gates the case that matters — a container that will not start never gets
  # traffic, because the deploy fails before the promote step. A new Rust
  # revision serving the previous web bundle is the rolling-deploy case the
  # engine's schema shim is built for (see lib/simulation-request.ts).

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-rust-candidate'
    entrypoint: gcloud
    waitFor: ['build-and-push-rust', 'build-and-push', 'verify-terraform-applied', 'verify-cloudflare-terraform-applied']
    args:
      - 'run'
      - 'deploy'
      - '${_RUST_SERVICE_NAME}'
      - '--image'
      - '${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_RUST_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--service-account'
      - '${_RUST_SERVICE_NAME}-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--port'
      - '8081'
      - '--no-traffic'
      - '--tag'
      - 'candidate'
      # Service shape — CPU, memory, scaling, timeout, ingress, concurrency,
      # startup CPU boost — is owned by Terraform (terraform/variables.tf).
      # `gcloud run deploy` preserves any setting it is not told about, so this
      # step ships the new image and leaves the shape alone.
      # Do not add --cpu or --memory here; either flag would override
      # Terraform-owned resource sizing on every deployment.

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'promote-rust'
    entrypoint: gcloud
    waitFor: ['deploy-rust-candidate']
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '${_RUST_SERVICE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--to-latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-candidate'
    entrypoint: 'sh'
    waitFor: ['build-and-push', 'promote-rust']
    args:
      - '-c'
      - |
        set -eu

        RUST_URL=$$(gcloud run services describe ${_RUST_SERVICE_NAME} \
          --region ${_REGION} \
          --format 'value(status.url)')
        # An empty URL deploys a web revision that cannot reach the engine, and
        # only surfaces later as a 503 from the smoke check.
        : "$${RUST_URL:?could not resolve the Rust service URL}"
        echo "Rust service URL: $$RUST_URL"

        # RUST_SERVICE_URL is set on the same revision that carries the new
        # image, so one deploy produces one revision. Setting it separately
        # would create a second revision and route traffic to it untested.
        gcloud run deploy ${_SERVICE_NAME} \
          --image ${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA \
          --region ${_REGION} \
          --platform managed \
          --service-account ${_SERVICE_NAME}-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --update-env-vars RUST_SERVICE_URL=$$RUST_URL \
          --no-traffic \
          --tag candidate

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-check-candidate'
    entrypoint: 'sh'
    waitFor: ['deploy-web-candidate']
    secretEnv: ['ORIGIN_SECRET']
    args:
      - '-c'
      - |
        set -eu

        CANDIDATE_URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region ${_REGION} \
          --format json | python3 scripts/cloud_run_candidate.py)

        echo "Smoke-checking candidate revision: $$CANDIDATE_URL"
        ./scripts/smoke-check.sh "$$CANDIDATE_URL"

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'promote-web'
    entrypoint: gcloud
    waitFor: ['smoke-check-candidate']
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '${_SERVICE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--to-latest'

# Note: No 'images' section needed - Kaniko pushes images directly via --destination flags
# Both Rust and web images are built and pushed by Kaniko in one step

# Build timeout (20 minutes)
timeout: '1200s'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/ORIGIN_SECRET/versions/${_ORIGIN_SECRET_VERSION}'
      env: 'ORIGIN_SECRET'
