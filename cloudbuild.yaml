# Optimized Google Cloud Build configuration
# Key improvements:
# - Rust simulation service deployed first (internal-only)
# - Tests run in GitHub Actions on PR (not duplicated here)
# - Kaniko for ALL Docker builds with layer caching (both Rust + Next.js)
# - Consistent build process, no 'images' section conflicts
# - Total time reduction: ~50% faster builds

substitutions:
  _SERVICE_NAME: retire-plan
  _RUST_SERVICE_NAME: rust-simulation-service
  _REGION: us-central1
  _REGISTRY: us-central1-docker.pkg.dev
  _REPOSITORY: retire-plan
  # Firebase client config — baked into the Next.js JS bundle by next build.
  # Not secrets (Firebase client config is intentionally public; security via Firebase Rules).
  # Actual values are set in the Cloud Build trigger via Terraform build_substitutions.
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_STORAGE_BUCKET: ''
  _FIREBASE_MESSAGING_SENDER_ID: ''
  _FIREBASE_APP_ID: ''
  _FIREBASE_MEASUREMENT_ID: ''

steps:
  # ===== BUILD PHASE (parallel) =====
  # Both images build concurrently. Neither service is deployed until both succeed.
  # A broken Next.js build can no longer leave a half-deployed Rust service behind.

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push-rust'
    waitFor: ['-']
    args:
      - '--context=dir://rust-simulation-service'
      - '--dockerfile=rust-simulation-service/Dockerfile'
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_RUST_SERVICE_NAME}:$COMMIT_SHA'
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_RUST_SERVICE_NAME}:latest'
      - '--cache=true'
      - '--cache-ttl=720h'
      - '--compressed-caching=false'
      - '--snapshot-mode=redo'
      - '--use-new-run'

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-and-push'
    waitFor: ['-']
    args:
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--destination=${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '--cache=true'
      - '--cache-ttl=720h'
      - '--compressed-caching=false'
      - '--snapshot-mode=redo'
      - '--use-new-run'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '--build-arg=NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}'

  # ===== DEPLOY PHASE =====
  # Only runs if both builds above passed.

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-rust'
    entrypoint: gcloud
    waitFor: ['build-and-push-rust', 'build-and-push']
    args:
      - 'run'
      - 'deploy'
      - '${_RUST_SERVICE_NAME}'
      - '--image'
      - '${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_RUST_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--ingress'
      - 'internal'
      - '--allow-unauthenticated'
      - '--port'
      - '8081'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '120'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-nextjs-env'
    entrypoint: 'sh'
    waitFor: ['deploy-rust']
    args:
      - '-c'
      - |
        RUST_URL=$$(gcloud run services describe ${_RUST_SERVICE_NAME} \
          --region ${_REGION} \
          --format 'value(status.url)')
        echo "Rust service URL: $$RUST_URL"

        if gcloud run services describe ${_SERVICE_NAME} --region ${_REGION} >/dev/null 2>&1; then
          gcloud run services update ${_SERVICE_NAME} \
            --region ${_REGION} \
            --update-env-vars RUST_SERVICE_URL=$$RUST_URL
        else
          echo "Next.js service doesn't exist yet, env var will be set on first deploy"
        fi

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    waitFor: ['build-and-push', 'update-nextjs-env']
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'health-check'
    entrypoint: 'sh'
    waitFor: ['deploy']
    args:
      - '-c'
      - |
        sleep 10
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region ${_REGION} \
          --format 'value(status.url)')
        curl -f -s -o /dev/null -w "%{http_code}" $$SERVICE_URL || exit 1
        echo "Deployment successful! Service is healthy."

# Note: No 'images' section needed - Kaniko pushes images directly via --destination flags
# Both Rust and Next.js images are built and pushed by Kaniko in one step

# Build timeout (20 minutes)
timeout: '1200s'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
